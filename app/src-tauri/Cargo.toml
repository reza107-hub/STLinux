[package]
name = "stlinux"
version = "0.1.0"
description = "STLinux, a Git client for Linux"
authors = ["STLinux"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stlinux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
